plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

// Specify your main class (change 'com.example.App' if your package/class name is different)
application {
    mainClass = 'org.application.App'
}

// Configure JavaFX version and modules you need
javafx {
    version = '21' // Or match the Java version you are using (e.g., 17 or 21)
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

